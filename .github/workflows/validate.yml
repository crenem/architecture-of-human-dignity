name: Validate research vault
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check internal Obsidian links
        run: python tools/vault_lint.py .
      - name: Run tooling tests
        run: python -m unittest discover -s tests -v
